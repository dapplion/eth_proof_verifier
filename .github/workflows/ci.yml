name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # Release, so the artifacts are the ones `cargo test --release` goes on to reuse. Proof
      # verification is field arithmetic, and unoptimised it takes minutes rather than milliseconds.
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo test --release
