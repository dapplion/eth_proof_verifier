name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # Release: proof verification is field arithmetic, and unoptimised it takes minutes rather
      # than milliseconds.
      - run: cargo clippy --all-targets --release --locked -- -D warnings
      - run: cargo test --release --locked

  zisk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # `proofman-starks-lib-c` builds rapidsnark, starkpil, blst and an MPI binding from C++ sources
      # in its build script. Needing all of this to *verify* is why the feature is off by default.
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libclang-dev pkg-config libssl-dev \
            libgmp-dev nasm libsodium-dev nlohmann-json3-dev libopenmpi-dev openmpi-bin \
            protobuf-compiler uuid-dev

      - run: cargo clippy --all-targets --release --locked --features zisk -- -D warnings
      - run: cargo test --release --locked --features zisk
