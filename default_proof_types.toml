# Proof types this binary serves out of the box.
#
# A proof type is an immutable (proof system, guest, version) triple: changing the guest or either
# version takes a NEW number, never an edit to an existing entry. EIP-8025 fixes the supported set
# at {1, 2, 3} but assigns no meanings, so these assignments are ours, and a `--proof-types` file
# overrides or extends them by number.
#
# No ZisK entry: that backend verifies, but its aggregation key moves with each ZisK patch release
# and the key for the version the published ZisK guests were built with is not available.
#
# Keys come from eth-act/ere-guests v0.17.1. `proof_system_version` is the version the guest was
# proved with, not the verifier's own: one pinned verifier reads several.

[[proof_types]]
proof_type = 1
proof_system = "sp1"
proof_system_version = "6.4.0"
guest = "reth"
guest_version = "0.1.0-rc.3"
program_vk = "00a03cbfa95559cfee3b45ef925f3f7a631181e35e774e92b040277d893511dd"

[[proof_types]]
proof_type = 2
proof_system = "sp1"
proof_system_version = "6.4.0"
guest = "ethrex"
guest_version = "27.0.0"
program_vk = "00f4d73c54dd9f0ae100b9736e80804cd03ba7e5093127d83ef4ca616ee8d8d3"
