[package]
name = "eth_proof_verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A standalone verifier for EIP-8025 execution proofs"
repository = "https://github.com/dapplion/eth_proof_verifier"
license = "Apache-2.0 OR MIT"

[dependencies]
axum = "0.8"
bincode = { version = "2", features = ["alloc", "serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SP1, pinned exactly so a build is reproducible. This is the version that verifies; a guest's own
# build version is recorded per proof type instead, because one verifier reads proofs from several.
# 6.4.0 no longer builds from crates.io at all: SP1's internal `slop-*` ranges have drifted.
sp1-hypercube = "=6.8.1"
sp1-primitives = "=6.8.1"
sp1-recursion-executor = "=6.8.1"
sp1-verifier = "=6.8.1"

# ZisK, pinned exactly for the same reason. 1.3.1-alpha is the latest published aggregation
# verifying key; that key changes between patch releases, so the pin and `VADCOP_FINAL_VK` move
# together or neither moves.
proofman-verifier = "=1.3.1-alpha"
zisk-verifier = "=1.3.1-alpha"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Already built as dependencies; the ZisK fixture tests need them by name to re-encode a proof with
# one field changed.
bincode = { version = "2", features = ["alloc", "serde"] }
proofman-verifier = "=1.3.1-alpha"
